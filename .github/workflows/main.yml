name: Build (main)
'on':
  push:
    branches:
    - main
    tags-ignore:
    - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test-format-license-headers:
    name: hawkeye-check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        persist-credentials: false
        fetch-depth: 0
    - run: git config --global --add safe.directory $(pwd)
    - run: hawkeye check --config licenserc.toml --fail-if-unknown
    container:
      image: ghcr.io/korandoru/hawkeye@sha256:e0abf8dbfaeeeba1249679d662d9fb404b1dcdb041c6093ea1f7a6edb7d89319
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Setup Neovim
      env:
        NEOVIM_VERSION: 0.12.6
      run: |-
        curl -fLO https://github.com/neovim/neovim/releases/download/v"$NEOVIM_VERSION"/nvim-linux-x86_64.tar.gz
        tar -C . -xzf nvim-linux-x86_64.tar.gz
        echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
    - name: Run tests
      run: make test
